name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: node smoke-test.mjs
      - run: node verify-visual.mjs
      - run: node verify-protocol.mjs
      - run: node verify-prune.mjs
      - run: node verify-rewind.mjs
      - run: node verify-follow.mjs
